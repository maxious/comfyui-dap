#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["einops", "mmengine", "open3d", "pyexr", "huggingface_hub", "torchmetrics", "xformers", "matplotlib", "safetensors", "opencv-python", "utils3d", "plyfile"]

[project.urls]
Repository = "https://github.com/maxious/comfyui-dap"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/maxious/comfyui-dap/wiki"
"Bug Tracker" = "https://github.com/maxious/comfyui-dap/issues"

[tool.comfy]
PublisherId = ""
